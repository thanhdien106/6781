name: Build Kernel (Patch Debug Full)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # ======================
    # Install tools
    # ======================
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
          git curl wget zip unzip bc bison flex \
          build-essential libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    # ======================
    # Clone kernel
    # ======================
    - name: Clone kernel
      run: |
        git clone --depth=1 \
        https://github.com/thanhdien106/6781.git kernel

    # ======================
    # Clone patch repo
    # ======================
    - name: Clone patch repo
      run: |
        git clone --depth=1 \
        https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki

    # ======================
    # BACKUP CLEAN SOURCE
    # ======================
    - name: Backup clean kernel (NO PATCH)
      run: |
        cp -r kernel kernel_clean

    # ======================
    # APPLY PATCH (NOT STRICT)
    # ======================
    - name: Apply patch (allow fail)
      run: |
        cd kernel

        PATCH_FILE="../nongki/Patches/Patch/susfs_patch_to_4.19.patch"

        set +e
        patch -p1 --batch --forward < "$PATCH_FILE"

        echo "PATCH EXIT CODE: $?"

    # ======================
    # SAVE PATCHED SOURCE
    # ======================
    - name: Save patched kernel
      run: |
        tar -czf kernel_patched_ok.tar.gz kernel

    # ======================
    # COLLECT REJECT FILES
    # ======================
    - name: Collect reject files
      if: always()
      run: |
        mkdir -p rej_out
        find kernel -name "*.rej" -exec cp --parents {} rej_out/ \; || true

        echo "=== REJ FILE LIST ==="
        find rej_out || true

    # ======================
    # SAVE BROKEN PATCH SOURCE (RAW AFTER PATCH FAIL)
    # ======================
    - name: Save broken patched source snapshot
      run: |
        tar -czf kernel_patched_partial.tar.gz kernel

    # ======================
    # SAVE CLEAN SOURCE AGAIN (FOR COMPARISON)
    # ======================
    - name: Save clean source backup
      run: |
        tar -czf kernel_clean.tar.gz kernel_clean

    # ======================
    # UPLOAD ALL ARTIFACTS
    # ======================
    - name: Upload patched (full)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-patched-full
        path: kernel_patched_ok.tar.gz

    - name: Upload partial patched (even if lỗi)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-patched-partial
        path: kernel_patched_partial.tar.gz

    - name: Upload clean kernel
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-clean
        path: kernel_clean.tar.gz

    - name: Upload reject files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: patch-rejects
        path: rej_out

    # ======================
    # DEBUG LOG
    # ======================
    - name: Show reject preview
      if: always()
      run: |
        echo "==== namespace.rej ===="
        cat kernel/fs/namespace.c.rej || true

        echo "==== task_mmu.rej ===="
        cat kernel/fs/proc/task_mmu.c.rej || true      run: |
        git clone --depth=1 \
        https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki

    # ========================
    # Apply SUSFS patch (SAFE)
    # ========================
    - name: Apply SUSFS patch
      run: |
        cd kernel

        PATCH_FILE="../nongki/Patches/Patch/susfs_patch_to_4.19.patch"

        echo "Patch file:"
        ls -l "$PATCH_FILE"

        set +e
        patch -p1 --batch --forward < "$PATCH_FILE"
        echo "Patch exit code: $?"

    # ========================
    # Debug reject files
    # ========================
    - name: Check reject files
      if: always()
      run: |
        echo "=== FIND REJECT FILES ==="
        find kernel -name "*.rej" -ls || true

        echo
        echo "=== CONTENT SAMPLE ==="
        cat kernel/fs/namespace.c.rej || true
        cat kernel/fs/proc/task_mmu.c.rej || true

    # ========================
    # Collect reject files
    # ========================
    - name: Collect reject files
      if: always()
      run: |
        mkdir -p rej_out
        find kernel -name "*.rej" -exec cp --parents {} rej_out/ \; || true

        echo "=== REJ OUTPUT TREE ==="
        find rej_out || true

    # ========================
    # Upload reject files
    # ========================
    - name: Upload reject files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reject-files
        path: rej_out

    # ========================
    # Configure kernel
    # ========================
    - name: Configure kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        make fleur_defconfig

    # ========================
    # Build kernel
    # ========================
    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        make -j$(nproc)

    # ========================
    # Upload kernel image
    # ========================
    - name: Upload kernel image
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: kernel/out/arch/arm64/boot/*
